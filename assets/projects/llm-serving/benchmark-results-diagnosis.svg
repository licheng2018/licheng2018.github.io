<text x="46" y="844" font-size="25" fill="#14487c" font-weight="700" text-anchor="start">Diagnosis  |  Observed, not inferred</text>
<text x="46" y="887" font-size="21" fill="#172943" font-weight="400" text-anchor="start">At 16 concurrent requests, the baseline delivered fewer</text>
<text x="46" y="918" font-size="21" fill="#172943" font-weight="400" text-anchor="start">tokens per second and much higher tail latency. These</text>
<text x="46" y="949" font-size="21" fill="#172943" font-weight="400" text-anchor="start">sweeps alone do not identify the bottleneck.</text>
<text x="752" y="844" font-size="25" fill="#17633e" font-weight="700" text-anchor="start">Next test  |  Separate the causes</text>
<text x="752" y="887" font-size="21" fill="#172943" font-weight="400" text-anchor="start">Record GPU utilization and profile queueing vs. execution.</text>
<text x="752" y="918" font-size="21" fill="#172943" font-weight="400" text-anchor="start">Compare with vLLM at matched prompts, output lengths</text>
<text x="752" y="949" font-size="21" fill="#172943" font-weight="400" text-anchor="start">and concurrency to test the scheduling / batching hypothesis.</text>
